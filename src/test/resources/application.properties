spring.thymeleaf.cache=false
spring.batch.job.enabled=false

elasticsearch.host=localhost
elasticsearch.port=9300
elasticsearch.cluster-name=elasticsearch

elasticsearch.trademark-index=pdb-trademark
elasticsearch.design-index=pdb-design
elasticsearch.dispute-index=pdb-dispute

#location where the binary files are stored, used for retrieving sound/multimedia files
tm.binarydata-dir=${user.home}/work/__tmp
#resource is image or thumbnail
tmdsview.image-ws-endpoint.tm=https://search.linta.lt/pdb/trademark/{resource}/{applicationNumber}
tmdsview.image-ws-endpoint.ds=https://search.linta.lt/pdb/design/{resource}/{st13}

niceclass.currentversion-year=2020

pdb.jdbc.url=jdbc:mysql://localhost:3306/pdb
pdb.jdbc.username=pdb
pdb.jdbc.password=pdb
pdb.jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
pdb.jpa.hibernate-dialect=org.hibernate.dialect.MySQL8Dialect

pdbpatents.jdbc.url=jdbc:mysql://localhost:3306/pdb_patents
pdbpatents.jdbc.username=pdb
pdbpatents.jdbc.password=pdb
pdbpatents.jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
pdbpatents.jpa.hibernate-dialect=org.hibernate.dialect.MySQL8Dialect

tmview.jdbc.url=jdbc:mysql://localhost:3306/tmview
tmview.jdbc.username=pdb
tmview.jdbc.password=pdb

tmview.jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
tmview.jpa.hibernate-dialect=org.hibernate.dialect.MySQL8Dialect

dsview.jdbc.url=jdbc:mysql://localhost:3306/dsview
dsview.jdbc.username=pdb
dsview.jdbc.password=pdb
dsview.jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
dsview.jpa.hibernate-dialect=org.hibernate.dialect.MySQL8Dialect


patent.images-dir=${user.home}/work/pdb-patents

# Common SMTP settings
smtp.host=localhost
smtp.port=25
smtp.user=
smtp.password=

opendata.mail.send-enabled=false
opendata.mail.from=atviri-duomenys@localhost
opendata.mail.to=recipients@localhost

opendata.scheduler.cron=0 25 3 1 * ?
opendata.xml.validateAgainstSchema=true
opendata.files-dir=${user.home}/work/__tmp/open-data/files
opendata.logs-dir=${user.home}/work/__tmp/open-data/files
opendata.page-url=http://localhost:8080/opendata

opendata.tm.image-uri-template=http://localhost:8080/pdb/trademark/image/{applicationNumber}
opendata.ds.image-uri-template=http://localhost:8080/pdb/design/image/{designNumber}
opendata.scheduler.enabled=false
