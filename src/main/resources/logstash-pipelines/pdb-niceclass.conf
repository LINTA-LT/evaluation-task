input {
  jdbc {
    jdbc_driver_library => "/home/myuser/pdb/logstash/lib/mysql-connector-java-8.0.18.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "@pdb.jdbc.url@"
    jdbc_user => "@pdb.jdbc.username@"
    jdbc_password => "@pdb.jdbc.password@"
    jdbc_paging_enabled => true
    jdbc_page_size => 100000
    last_run_metadata_path => "/home/myuser/pdb/logstash/.logstash_nicaclass"
    statement => "SELECT 
                      TERMID as id, 
                      VERSIONYEAR as year, 
                      VERSION as version, 
                      CLASSTYPE as class_type, 
                      CLASSNR as class_number, 
                      TERMTEXTLT as term_lt, 
                      lower(TERMTEXTLT) as term_lt_lc, 
                      TERMTEXTEN as term_en, 
                      lower(TERMTEXTEN) as term_en_lc,
                      TERMBASENR as term_number, 
                      TERMSTATUS as status
                  FROM niceclassterm t 
                  JOIN niceclass c ON t.CLASSID = c.CLASSID 
                  JOIN niceclassversion v on c.VERSIONID = v.VERSIONID 
                  ORDER BY TERMID"
    type => "niceclass"
  }
}

output {
    elasticsearch {
      hosts => ['http://@elasticsearch.host@:9200']
      index => 'pdb-niceclass'
      document_id => '%{id}'
  }
}

