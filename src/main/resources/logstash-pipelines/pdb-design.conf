filter {
  if [type] == "pdb-design" {
    jdbc_streaming {
      jdbc_driver_library => "/home/myuser/pdb/logstash/lib/mysql-connector-java-8.0.18.jar"
      jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
      jdbc_connection_string => "@dsview.jdbc.url@"
      jdbc_user => "@dsview.jdbc.username@"
      jdbc_password => "@dsview.jdbc.password@"
      statement => "SELECT
                        d.DESIGNIDENTIFIER AS designidentifier,
                        di.SEQUENCENUMBER AS sequencenumber,
                        d.TYCURRENTSTATUSCODE as currentstatuscode,
                        d.DTEXPIRY as expirationdate
                    FROM
                        designimage di
                    JOIN
                        dsview.design d ON d.DESIGNID = di.DESIGNID and d.applicationnumber = :applicationnumber
                    order by designidentifier asc, sequencenumber asc"
      parameters => { "applicationnumber" => "applicationnumber"}
      target => "samples"
    }

    jdbc_streaming {
      jdbc_driver_library => "/home/myuser/pdb/logstash/lib/mysql-connector-java-8.0.18.jar"
      jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
      jdbc_connection_string => "@dsview.jdbc.url@"
      jdbc_user => "@dsview.jdbc.username@"
      jdbc_password => "@dsview.jdbc.password@"
      statement => "SELECT DISTINCT
                        dp.ROLEIDENTIFIER AS roleid,
                        p.FIRSTNAME AS firstname, lower(p.FIRSTNAME) AS firstname_lc,
                        p.MIDDLENAME AS middlename, lower(p.MIDDLENAME) AS middlename_lc,
                        p.LASTNAME AS lastname, lower(p.LASTNAME) AS lastname_lc,
                        p.FREEFORMNAME AS freeformname, lower(p.FREEFORMNAME) AS freeformname_lc,
                        p.ORGNAME AS orgname, lower(p.ORGNAME) AS orgname_lc,
                        p.SANCTIONS as sanctions,
                        a.TYCOUNTRYCODE AS tycountrycode,
                        a.STREET AS street, lower(a.STREET) AS street_lc,
                        a.CITY AS city, lower(a.CITY) AS city_lc,
                        a.POSTCODE AS postcode, lower(a.POSTCODE) as postcode_lc,
                        CONCAT_WS(', ', lower(a.STREET), lower(a.CITY), lower(a.TYCOUNTRYCODE), lower(a.POSTCODE)) AS freeformaddress_lc,
                        a.isdefault,
                        -1 as ispremises,
                        -1 as isprimary
                    FROM
                        person p
                    JOIN
                        address a on a.personid = p.personid
                    JOIN
                        designperson dp ON dp.PERSONID = p.PERSONID
                    JOIN
                        design d ON d.DESIGNID = dp.DESIGNID and dp.ROLEIDENTIFIER = 1 and d.applicationnumber= :applicationnumber
                    WHERE a.isactive = 1
                UNION ALL
                SELECT DISTINCT
                        dp.ROLEIDENTIFIER AS roleid,
                        p.FIRSTNAME AS firstname, lower(p.FIRSTNAME) AS firstname_lc,
                        p.MIDDLENAME AS middlename, lower(p.MIDDLENAME) AS middlename_lc,
                        p.LASTNAME AS lastname, lower(p.LASTNAME) AS lastname_lc,
                        p.FREEFORMNAME AS freeformname, lower(p.FREEFORMNAME) AS freeformname_lc,
                        p.ORGNAME AS orgname, lower(p.ORGNAME) AS orgname_lc,
                        p.SANCTIONS as sanctions,
                        a.TYCOUNTRYCODE AS tycountrycode,
                        a.STREET AS street, lower(a.STREET) AS street_lc,
                        a.CITY AS city, lower(a.CITY) AS city_lc,
                        a.POSTCODE AS postcode, lower(a.POSTCODE) as postcode_lc,
                        CONCAT_WS(', ', lower(a.STREET), lower(a.CITY), lower(a.TYCOUNTRYCODE), lower(a.POSTCODE)) AS freeformaddress_lc,
                        a.isdefault,
                        pda.ispremises,
                        pda.isprimary
                    FROM
                        persondesignaddress pda
                    JOIN
                        address a on a.addressid = pda.addressid
                    JOIN
                        person p on a.personid = p.personid
                    JOIN
                        designperson dp ON dp.PERSONID = p.PERSONID
                    JOIN
                        design d ON d.DESIGNID = dp.DESIGNID and dp.ROLEIDENTIFIER = 1 and d.applicationnumber= :applicationnumber
                        WHERE a.isactive = 1
                order by ispremises desc, isprimary desc, isdefault desc"
      parameters => { "applicationnumber" => "applicationnumber"}
      target => "applicants"
    }

    jdbc_streaming {
      jdbc_driver_library => "/home/myuser/pdb/logstash/lib/mysql-connector-java-8.0.18.jar"
      jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
      jdbc_connection_string => "@dsview.jdbc.url@"
      jdbc_user => "@dsview.jdbc.username@"
      jdbc_password => "@dsview.jdbc.password@"
      statement => "SELECT DISTINCT
                        dp.ROLEIDENTIFIER AS roleid,
                        p.FIRSTNAME AS firstname, lower(p.FIRSTNAME) AS firstname_lc,
                        p.MIDDLENAME AS middlename, lower(p.MIDDLENAME) AS middlename_lc,
                        p.LASTNAME AS lastname, lower(p.LASTNAME) AS lastname_lc,
                        p.FREEFORMNAME AS freeformname, lower(p.FREEFORMNAME) AS freeformname_lc,
                        p.ORGNAME AS orgname, lower(p.ORGNAME) AS orgname_lc,
                        a.TYCOUNTRYCODE AS tycountrycode,
                        a.STREET AS street, lower(a.STREET) AS street_lc,
                        a.CITY AS city, lower(a.CITY) AS city_lc,
                        a.POSTCODE AS postcode, lower(a.POSTCODE) as postcode_lc,
                        CONCAT_WS(', ', lower(a.STREET), lower(a.CITY), lower(a.TYCOUNTRYCODE), lower(a.POSTCODE)) AS freeformaddress_lc,
                        a.isdefault,
                        -1 as ispremises,
                        -1 as isprimary
                    FROM
                        person p
                    JOIN
                        address a on a.personid = p.personid
                    JOIN
                        designperson dp ON dp.PERSONID = p.PERSONID
                    JOIN
                        design d ON d.DESIGNID = dp.DESIGNID and dp.ROLEIDENTIFIER in (2, 5, 7) and d.applicationnumber= :applicationnumber
                    WHERE a.isactive = 1
                UNION ALL
                SELECT DISTINCT
                        dp.ROLEIDENTIFIER AS roleid,
                        p.FIRSTNAME AS firstname, lower(p.FIRSTNAME) AS firstname_lc,
                        p.MIDDLENAME AS middlename, lower(p.MIDDLENAME) AS middlename_lc,
                        p.LASTNAME AS lastname, lower(p.LASTNAME) AS lastname_lc,
                        p.FREEFORMNAME AS freeformname, lower(p.FREEFORMNAME) AS freeformname_lc,
                        p.ORGNAME AS orgname, lower(p.ORGNAME) AS orgname_lc,
                        a.TYCOUNTRYCODE AS tycountrycode,
                        a.STREET AS street, lower(a.STREET) AS street_lc,
                        a.CITY AS city, lower(a.CITY) AS city_lc,
                        a.POSTCODE AS postcode, lower(a.POSTCODE) as postcode_lc,
                        CONCAT_WS(', ', lower(a.STREET), lower(a.CITY), lower(a.TYCOUNTRYCODE), lower(a.POSTCODE)) AS freeformaddress_lc,
                        a.isdefault,
                        pda.ispremises,
                        pda.isprimary
                    FROM
                        persondesignaddress pda
                    JOIN
                        address a on a.addressid = pda.addressid
                    JOIN
                        person p on a.personid = p.personid
                    JOIN
                        designperson dp ON dp.PERSONID = p.PERSONID
                    JOIN
                        design d ON d.DESIGNID = dp.DESIGNID and dp.ROLEIDENTIFIER in (2, 5, 7)  and d.applicationnumber= :applicationnumber
                order by ispremises desc, isprimary desc, isdefault desc"
      parameters => { "applicationnumber" => "applicationnumber"}
      target => "representatives"
    }
    jdbc_streaming {
          jdbc_driver_library => "/home/myuser/pdb/logstash/lib/mysql-connector-java-8.0.18.jar"
          jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
          jdbc_connection_string => "@dsview.jdbc.url@"
          jdbc_user => "@dsview.jdbc.username@"
          jdbc_password => "@dsview.jdbc.password@"
          statement => "SELECT prioritynumber, tycountrycode, DATE_ADD(dtpriority, INTERVAL 12 HOUR) as dtpriority FROM priority WHERE designid = :designid and TYSOVIETUNION = 'Conventional'"
          parameters => { "designid" => "designid"}
          target => "dsPriorities"
    }

    mutate {
      split => { "locarnoclassification" => "," }
    }
  }
}

