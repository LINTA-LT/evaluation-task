input {
  jdbc {
    jdbc_driver_library => "/home/myuser/pdb/logstash/lib/mysql-connector-java-8.0.18.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "@pdb.jdbc.url@"
    jdbc_user => "@pdb.jdbc.username@"
    jdbc_password => "@pdb.jdbc.password@"
    schedule => "0 23 * * *"
    last_run_metadata_path => "/home/myuser/pdb/logstash/.logstash_pdb_dispute"
    statement => "select * from dispute"
    type => "pdb-dispute"
  }
}

filter {
  if [type] == "pdb-dispute" {
    mutate {
      split => { "niceclassification" => "," }
    }
    mutate {
      split => { "grounds" => "," }
    }
    mutate {
      lowercase => ["tydecisiontaken", "stcurrentstatus"]
    }
  }
}

output {
  if [type] == "pdb-dispute" {
    elasticsearch {
      hosts => ['http://@elasticsearch.host@:9200']
      index => 'pdb-dispute'
      document_id => '%{refapplicationnumber}'
    }
  }
}

