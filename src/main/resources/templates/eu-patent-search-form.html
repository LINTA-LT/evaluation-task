<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{welcomepage.patents.eu.search}"/>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/jquery-ui-1.12.1/jquery-ui.css}">

    <script th:src="@{/js/utilities.js}"></script>
    <script th:src="@{/js/jquery-3.4.1.js}"></script>
    <script th:src="@{/jquery-ui-1.12.1/jquery-ui.min.js}"></script>
    <script th:src="@{/jquery-ui-1.12.1/datepicker-lt.js}"></script>
    <script th:inline="javascript">
        //locale language "lt" or "en" for the calendar
        var locale = [[${#locale.language}]];
    </script>
    <script>
        $( function() {
            $( "[data-type='datepicker']").datepicker(
                {
                    constrainInput: true,
                    dateFormat: "yy/mm/dd",
                    firstDay: 1
                }
            );
        } );
        $.datepicker.setDefaults( $.datepicker.regional[ locale ] );
    </script>

</head>

<body>

<div class="container-fluid">

    <div class="row mb2">
        <div class="col-md-7 col-sm-12">
            <a th:href="@{/}">
                <img th:src="@{/images/home-button-icon-6.png}" width="24px" height="24px" th:alt="#{common.homepage}">
            </a>
            <a class="lang-select" th:href="@{''(lang='en')}">EN</a>
            <span class="lang-select-separator"> | </span>
            <a class="lang-select" th:href="@{''(lang='lt')}">LT</a>
        </div>
    </div>

    <div class="row mb-2">
        <div class="col-12 d-flex justify-content-end">
            <p>
                <span class="mr-1"><span th:text="#{common.lastupdate}"/>: </span>
                <span class='color_rez'><span class="color_rez" th:text="${lastUpdated}"/></span>
            </p>
        </div>
    </div>

    <form class="form-vpb form-inline" th:action="@{/patent/eu/search}" method="get" th:object="${searchForm}">

        <div class="form-group row mr-md-0 ml-md-0 d-red">
            <h4 th:text="#{welcomepage.patents.eu.search}"/>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 d-red">
            <h4 th:text="#{common.searchform.title}"/>
        </div>


        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f11_mc">
                    <strong>(11)</strong> <span th:text="#{patent.eu.searchform.number}"/>
                </label>
            </div>
            <div class="col-md-3">
                <select id="f11_mc" class="form-control" name="f11_mc">
                    <option value="eq" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'eq' : false}" th:text="#{common.dropdown.option.equals}"/>
                    <option value="has" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'has' : true}" th:text="#{common.dropdown.option.contains}"/>
                    <option value="sw" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'sw' : false}" th:text="#{common.dropdown.option.startswith}"/>
                    <option value="ew" th:selected="${searchForm.f21_mc!= null ? searchForm.f21_mc.value == 'ew' : false}" th:text="#{common.dropdown.option.endswith}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f11" maxlength="128" th:value="*{f11}"/>
            </div>
            <div class="col-md-2">
                <a th:href="|javascript: openHelpWindow('@{/patent-help.html#11}');|"><img border="0" th:src="@{/images/questionmark.gif}"/></a>
            </div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="status_mc" th:text="#{patent.eu.searchform.status}"/>
            </div>
            <div class="col-md-3">
                <select id="status_mc" disabled="disabled" class="form-control" name="status_mc">
                    <option value="eq" selected="selected" th:text="#{common.dropdown.option.equals}"/>
                </select>
            </div>
            <div th:replace="fragments/select-dropdown :: dropdown(
                'status',
                'status',
                ${searchForm.status},
                ${patentEuStatuses},
                'common.dropdown.label.all',
                'col-md-3')">
            </div>

            <div class="col-md-1">
            </div>
        </div>

        <input class="btn btn-primary btn-vpb d-none" type="submit" th:value="#{common.searchform.submit}"/>

        <div class="form-group row mr-md-0 ml-md-0">
            <div class="col-md-5 offset-md-5 extend-search-vpb">
                <button type="submit" th:formaction="@{/patent/eu/advanced-search-form}" class="link-button-extend-search">
                    <img th:src="@{/images/cross.jpg}" border="0"/>
                    <span th:text="#{common.advancedsearch}"/></a>
                </button>
            </div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0">
            <div class="col-md-8 offset-md-2 btn-wrap">
                <input class="btn btn-primary btn-vpb" type="submit" th:value="#{common.searchform.submit}"/>
                <input class="btn btn-primary btn-vpb" type="reset" th:value="#{common.searchform.reset}"/>
            </div>
        </div>

    </form>

</div>

</body>
</html>
