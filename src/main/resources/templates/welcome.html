<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title th:text="#{welcomepage.windowtitle}"/>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">

    <link rel="stylesheet" th:href="@{/screen.css}"/>

</head>
