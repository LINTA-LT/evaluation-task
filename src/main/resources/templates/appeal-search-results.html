<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{dispute.appeal.searchresults.windowtitle}"/>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/style.css}">

    <script th:src="@{/js/utilities.js}"></script>

</head>
<body>

<div class="container-fluid">

    <div class="row mb2">
        <div class="col-md-7 col-sm-12" th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}">
            <a th:href="@{/}">
                <img th:src="@{/images/home-button-icon-6.png}" width="24px" height="24px" th:alt="#{common.homepage}">
            </a>
            <a class="lang-select" th:href="@{${urlBuilder.replaceQueryParam('lang', 'en').build().toUriString()}}">EN</a>
            <span class="lang-select-separator"> | </span>
            <a class="lang-select" th:href="@{${urlBuilder.replaceQueryParam('lang', 'lt').build().toUriString()}}">LT</a>
        </div>
    </div>

    <div class="row mr-md-0 ml-md-0 d-red">
        <h4 th:text="#{welcomepage.appeals.search}"/>
    </div>

    <div class='row top-row'>
        <div class='col-md-7 col-sm-12'>
            <a th:href="@{/dispute/appeal/search-form}" th:text="#{common.newsearch}"/>
        </div>
        <div class='col-md-5 col-sm-12 search-rez-line'>
            <span th:text="#{common.searchresult}"/>
            <span style="color:#800000;">
                <strong>(<span th:text="#{common.totalresults}"/>: <span th:text="${totalHits}"/>)</strong>
            </span>
            <div><span th:text="#{common.lastupdate}"/>: <span class="color_rez" th:text="${lastUpdated}"/></div>
        </div>
    </div>

    <div class="row mb-2">
        <div class="col-7 d-flex justify-content-start">
            <span class="print" onClick="window.print(); return false;"><span th:text="#{common.print}"/> <img th:src="@{/images/print.png}" th:alt="#{common.print}"></span>
        </div>
        <div class="col-5 d-flex justify-content-end">
            <a style="color: #afafaf; text-decoration: none;" th:with="queryString=${#request.getQueryString()}"
               th:href="@{'/dispute/appeal/export/xlsx?' + ${queryString}}">
                <span th:text="#{common.export.excel}"/>
                <img th:src="@{/images/excel-icon-small.png}" width="24px" height="24px" th:alt="#{common.export.excel}">
            </a>
        </div>
    </div>

    <table class="table table-striped table-vpb">
        <tbody><tr>
            <th th:text="#{dispute.common.list.no}"/>
            <th>
                <div>
                    <span th:text="#{dispute.appeal.list.refappnumber}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'refapplicationnumber.keyword').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'refapplicationnumber.keyword'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'refapplicationnumber.keyword').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'refapplicationnumber.keyword'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>
                </div>
            </th>
            <th>
                <div>
                    <span th:text="#{dispute.common.list.applicationnumber}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'applicationnumber.keyword').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'applicationnumber.keyword'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'applicationnumber.keyword').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'applicationnumber.keyword'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>
                </div>
            </th>
            <th>
                <div>
                    <span th:text="#{dispute.common.list.decisiondate}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'dtdecisioncameintoeffect').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'dtdecisioncameintoeffect'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'dtdecisioncameintoeffect').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'dtdecisioncameintoeffect'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>
                </div>
            </th>
            <th th:text="#{dispute.common.list.decisionnumber}"/>
            <th th:text="#{dispute.common.list.disputedtrademark}"/>
            <th th:text="#{dispute.common.list.registrationnumber}"/>
            <th th:text="#{dispute.common.list.niceclassification}"/>
            <th th:text="#{dispute.common.list.grounds}"/>
            <th th:text="#{dispute.common.list.decision}"/>
            <th th:text="#{dispute.common.list.decisiontext}"/>
            <th th:text="#{dispute.appeal.list.status}"/>
        </tr>
        <tr th:each="dispute: ${disputeItems}">
            <td><span th:text="${(searchForm.offset + disputeStat.index + 1)}"/>.</td>
            <td th:text="${dispute.refApplicationNumber}"></td>
            <td>
                <a th:if="${dispute.international}" th:href="@{'https://branddb.wipo.int/en/brand/WO50000000' + ${dispute.applicationNumber}}" onclick="openDetailsWindow(this.href); return false;">
                    <strong th:text="${dispute.applicationNumber}"/>
                </a>
                <a th:unless="${dispute.international}" th:href="@{/trademark/details/{applicationNumber}(applicationNumber=${dispute.applicationNumber})}" onclick="openDetailsWindow(this.href); return false;">
                    <strong th:text="${dispute.applicationNumber}"/>
                </a>
            </td>
            <td th:text="${dispute.decisionDate}"></td>
            <td th:text="${dispute.caseNumber}"></td>
            <td th:text="${dispute.contestedTrademark}"></td>
            <td th:text="${dispute.registrationNumber}"></td>
            <td th:text="${dispute.niceClassification}"></td>
            <td th:text="${dispute.grounds}"></td>
            <td>
                <th:block th:if="${T(org.apache.commons.lang3.StringUtils).isNotEmpty(dispute.decision)}">
                    <span th:text="#{'dispute.appeal.decision.' + ${dispute.decision}}"/>
                </th:block>
            </td>
            <td>
                <th:block th:if="${T(org.apache.commons.lang3.StringUtils).isNotEmpty(dispute.decision)}">
                    <a th:href="@{/dispute/details/{refApplicationNumber}(refApplicationNumber=${dispute.refApplicationNumber})}" onclick="openDetailsWindow(this.href); return false;">
                        <strong><span th:text="#{dispute.common.list.decisiontext}"/></strong>
                    </a>
                </th:block>
            </td>
            <td>
                <th:block th:if="${T(org.apache.commons.lang3.StringUtils).isNotEmpty(dispute.status)}">
                    <span th:text="#{'dispute.status.' + ${dispute.status}}"/>
                </th:block>
            </td>
        </tr>
        </tbody>
    </table>

    <th:block th:if="${(searchForm.offset - searchForm.size) >= 0}">
        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
           th:href="${urlBuilder.replaceQueryParam('offset', (searchForm.offset - searchForm.size)).build().toUriString()}"
           class="btn btn-default btn-vpb"><span th:text="#{common.navigation.previous}"/></a>
    </th:block>

    <th:block th:if="${(searchForm.offset + searchForm.size) < totalHits}">
        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
           th:href="${urlBuilder.replaceQueryParam('offset', (searchForm.offset + searchForm.size)).build().toUriString()}"
           class="btn btn-default btn-vpb"><span th:text="#{common.navigation.next}"/></a>
    </th:block>
    <br/><br/>

</div>
</body>
</html>
