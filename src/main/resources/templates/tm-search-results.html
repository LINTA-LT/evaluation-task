<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{welcomepage.trademarks.search}"/>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/style.css}">

    <script th:src="@{/js/utilities.js}"></script>

</head>
<body>

<div class="container-fluid">

    <div class="row mb2">
        <div class="col-md-7 col-sm-12" th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}">
            <a th:href="@{/}">
                <img th:src="@{/images/home-button-icon-6.png}" width="24px" height="24px" th:alt="#{common.homepage}">
            </a>
            <a class="lang-select" th:href="@{${urlBuilder.replaceQueryParam('lang', 'en').build().toUriString()}}">EN</a>
            <span class="lang-select-separator"> | </span>
            <a class="lang-select" th:href="@{${urlBuilder.replaceQueryParam('lang', 'lt').build().toUriString()}}">LT</a>
        </div>
    </div>

    <div class="row mr-md-0 ml-md-0 d-red">
        <h4 th:text="#{welcomepage.trademarks.search}"/>
    </div>

    <div class="row top-row">
        <div class='col-md-7 col-sm-12'>
            <a th:href="@{/trademark/search-form}" th:text="#{common.newsearch}"/>
        </div>
        <div class='col-md-5 col-sm-12 search-rez-line'>
            <span th:text="#{common.searchresult}"/>
            <span style="color:#800000;">
                <strong>(<span th:text="#{common.totalresults}"/>: <span th:text="${totalHits}"/>)</strong>
            </span>
            <div><span th:text="#{common.lastupdate}"/>: <span class="color_rez" th:text="${lastUpdated}"/></div>
        </div>
    </div>

    <div class="row mb-2">
        <div class="col-7 d-flex justify-content-start">
            <span class="print" onClick="window.print(); return false;"><span th:text="#{common.print}"/> <img th:src="@{/images/print.png}" th:alt="#{common.print}"></span>
        </div>
        <div class="col-5 d-flex justify-content-end">
            <a style="color: #afafaf; text-decoration: none;" th:with="queryString=${#request.getQueryString()}"
               th:href="@{'/trademark/export/xlsx?' + ${queryString}}">
                <span th:text="#{common.export.excel}"/>
                <img th:src="@{/images/excel-icon-small.png}" width="24px" height="24px" th:alt="#{common.export.excel}">
            </a>
        </div>
    </div>

    <table class="table table-striped table-vpb">
        <tbody><tr>
            <th th:text="#{ip.list.no}"/>
            <th th:text="#{ip.list.tm.verbalelement}"/>
            <th th:text="#{ip.list.tm.type}"/>
            <th>
                <div>
                    <span th:text="#{ip.list.applicationnumber}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'applicationnumber.keyword').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'applicationnumber.keyword'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'applicationnumber.keyword').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'applicationnumber.keyword'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>

                </div>
            </th>

            <th>
                <div>
                    <span th:text="#{ip.list.registrationnumber}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'registrationnumber_numeric').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'registrationnumber_numeric'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'registrationnumber_numeric').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'registrationnumber_numeric'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>
                </div>
            </th>

            <th th:text="#{ip.list.tm.graphics}"/>
            <th th:text="#{ip.list.tm.niceclass}"/>
            <th>
                <div>
                    <span th:text="#{ip.list.expirydate}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'dtexpiry').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'dtexpiry'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'dtexpiry').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'dtexpiry'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>
                </div>

            </th>

            <th>
                <div>
                    <span th:text="#{ip.list.status}"/>
                    <div class="sort_box">
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'status_' + #locale.language + '.keyword').replaceQueryParam('sortDir', 'asc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'status_' + #locale.language + '.keyword'  && searchForm.sortDir == 'asc' ? 'arrow-up selected' : 'arrow-up'}"></a>
                        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                           th:href="${urlBuilder.replaceQueryParam('sortField', 'status_' + #locale.language + '.keyword').replaceQueryParam('sortDir', 'desc').replaceQueryParam('offset', '0').build().toUriString()}"
                           th:class="${searchForm.sortField == 'status_' + #locale.language + '.keyword'  && searchForm.sortDir == 'desc' ? 'arrow-down selected' : 'arrow-down'}"></a>
                    </div>
                </div>
            </th>

        </tr>
        <tr th:each="trademark: ${trademarks}">
            <td><span
                    th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
                    th:text="${(searchForm.offset + trademarkStat.index + 1)}"/>.
            </td>
            <td>
                <a th:href="@{/trademark/details/{applicationnumber}(applicationnumber=${trademark.applicationNumber})}" onclick="openDetailsWindow(this.href); return false;">
                    <img th:src="@{/images/cross.jpg}"/> <strong th:text="${trademark.trademark}"/>
                </a>
            </td>
            <td>
                <span th:text="#{'trademark.tyfeature.' + ${trademark.tyfeature}}"/>
            </td>
            <td th:text="${trademark.applicationNumber}"></td>
            <td th:text="${trademark.registrationNumber}"></td>
            <td>
                <img th:unless="${trademark.isTyfeatureIn('Word', 'Multimedia', 'Sound') || trademark.filename == null || trademark.filename == ''}"
                        th:src="@{/trademark/thumbnail/{applicationNumber}(applicationNumber=${trademark.applicationNumber})}"/>
            </td>
            <td th:text="${trademark.classification}"></td>
            <td th:text="${trademark.expires}"></td>
            <td>
                <span th:if="${#locale.language == 'lt'}" th:text="${trademark.statusLt}"/>
                <span th:if="${#locale.language == 'en'}" th:text="${trademark.statusEn}"/>
                <div th:if="${trademark.indSeniority}" th:text="#{ip.list.tm.status.ctmseniorityclaimed}"/>

            </td>
        </tr>
        </tbody>
    </table>

    <th:block th:if="${(searchForm.offset - searchForm.size) >= 0}">
        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
           th:href="${urlBuilder.replaceQueryParam('offset', (searchForm.offset - searchForm.size)).build().toUriString()}"
           class="btn btn-default btn-vpb" th:text="#{common.navigation.previous}"/>
    </th:block>

    <th:block th:if="${(searchForm.offset + searchForm.size) < totalHits}">
        <a th:with="urlBuilder=${T(org.springframework.web.servlet.support.ServletUriComponentsBuilder).fromCurrentRequest()}"
           th:href="${urlBuilder.replaceQueryParam('offset', (searchForm.offset + searchForm.size)).build().toUriString()}"
           class="btn btn-default btn-vpb" th:text="#{common.navigation.next}"/>
    </th:block>

</div>

</body>
</html>
