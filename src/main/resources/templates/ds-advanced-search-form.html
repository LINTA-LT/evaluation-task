<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{welcomepage.designs.search}"/>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/jquery-ui-1.12.1/jquery-ui.css}">

    <script th:src="@{/js/utilities.js}"></script>
    <script th:src="@{/js/jquery-3.4.1.js}"></script>
    <script th:src="@{/jquery-ui-1.12.1/jquery-ui.min.js}"></script>
    <script th:src="@{/jquery-ui-1.12.1/datepicker-lt.js}"></script>
    <script th:inline="javascript">
        //locale language "lt" or "en" for the calendar
        var locale = [[${#locale.language}]];
    </script>
    <script>
        $( function() {
            $( "[data-type='datepicker']").datepicker(
                {
                    constrainInput: true,
                    dateFormat: "yy/mm/dd",
                    firstDay: 1
                }
            );
        } );
        $.datepicker.setDefaults( $.datepicker.regional[ locale ] );
    </script>

</head>
<body>

<div class="container-fluid">

    <div class="row mb2">
        <div class="col-md-7 col-sm-12">
            <a th:href="@{/}">
                <img th:src="@{/images/home-button-icon-6.png}" width="24px" height="24px" th:alt="#{common.homepage}">
            </a>
            <a class="lang-select" th:href="@{''(lang='en')}">EN</a>
            <span class="lang-select-separator"> | </span>
            <a class="lang-select" th:href="@{''(lang='lt')}">LT</a>
        </div>
    </div>

    <div class="row mb-2">
        <div class="col-12 d-flex justify-content-end">
            <p>
                <span class="mr-1"><span th:text="#{common.lastupdate}"/>: </span>
                <span class='color_rez'><span class="color_rez" th:text="${lastUpdated}"/></span>
            </p>
        </div>
    </div>

    <form class="form-vpb form-inline" th:action="@{/design/advanced-search}" method="get" th:object="${searchForm}">

        <div class="form-group row mr-md-0 ml-md-0 d-red">
            <h4 th:text="#{welcomepage.designs.search}"/>
        </div>

        <!-- ********* Design description ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f54_mc">
                    <strong>(54)</strong>
                    <span th:text="#{ds.searchform.designtitle}"/>
                </label>
            </div>
            <div class="col-md-3">
                <select id="f54_mc" class="form-control" name="f54_mc">
                    <option value="eq" th:selected="${searchForm.f54_mc != null ? searchForm.f54_mc.value == 'eq' : false}" th:text="#{common.dropdown.option.equals}"/>
                    <option value="has" th:selected="${searchForm.f54_mc != null ? searchForm.f54_mc.value == 'has' : true}" th:text="#{common.dropdown.option.contains}"/>
                    <option value="sw" th:selected="${searchForm.f54_mc != null ? searchForm.f54_mc.value == 'sw' : false}" th:text="#{common.dropdown.option.startswith}"/>
                    <option value="ew" th:selected="${searchForm.f54_mc != null ? searchForm.f54_mc.value == 'ew' : false}" th:text="#{common.dropdown.option.endswith}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f54" maxlength="128" th:value="*{f54}">
            </div>
            <div class="col-md-1">
                <a th:href="|javascript: openHelpWindow('@{/ds-help.html#54}');|"><img border="0" th:src="@{/images/questionmark.gif}"></a>
            </div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f11_mc">
                    <strong>(11)</strong> <span th:text="#{ip.searchform.registrationnumber}"/>
                </label>
            </div>
            <div class="col-md-3">
                <select id="f11_mc" class="form-control" name="f11_mc">
                    <option value="eq" th:selected="${searchForm.f11_mc != null ? searchForm.f11_mc.value == 'eq' : true}" th:text="#{common.dropdown.option.equals}"/>
                    <option value="has" th:selected="${searchForm.f11_mc != null ? searchForm.f11_mc.value == 'has' : false}" th:text="#{common.dropdown.option.contains}"/>
                    <option value="sw" th:selected="${searchForm.f11_mc != null ? searchForm.f11_mc.value == 'sw' : false}" th:text="#{common.dropdown.option.startswith}"/>
                    <option value="ew" th:selected="${searchForm.f11_mc != null ? searchForm.f11_mc.value == 'ew' : false}" th:text="#{common.dropdown.option.endswith}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f11" maxlength="30" th:value="*{f11}">
            </div>
            <div class="col-md-1">
                <a th:href="|javascript: openHelpWindow('@{/ds-help.html#11}');|"><img border="0" th:src="@{/images/questionmark.gif}"></a>
            </div>
        </div>

        <!-- ********* Application number ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f21_mc"><strong>(21)</strong><span th:text="#{ip.searchform.applicationnumber}"/></label>
            </div>
            <div class="col-md-3">
                <select id="f21_mc" class="form-control" name="f21_mc">
                    <option value="eq" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'eq' : true}" th:text="#{common.dropdown.option.equals}"/>
                    <option value="has" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'has' : false}" th:text="#{common.dropdown.option.contains}"/>
                    <option value="sw" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'sw' : false}" th:text="#{common.dropdown.option.startswith}"/>
                    <option value="ew" th:selected="${searchForm.f21_mc != null ? searchForm.f21_mc.value == 'ew' : false}" th:text="#{common.dropdown.option.endswith}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f21" maxlength="30" th:value="*{f21}">
            </div>
            <div class="col-md-1">
                <a th:href="|javascript: openHelpWindow('@{/ds-help.html#21}');|"><img border="0" th:src="@{/images/questionmark.gif}"></a>
            </div>
        </div>

        <!-- ********* Application date ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label>
                    <strong>(22)</strong>
                    <span th:text="#{ip.searchform.applicationdate}"/>
                </label>
            </div>
            <label for="f22_from" class="col-md-1" th:text="#{ip.searchform.datefrom}"/>
            <div class="col-md-2">
                <input id="f22_from" data-type="datepicker" placeholder="yyyy/mm/dd" class="form-control" name="f22_from" th:value="*{f22_from}">
            </div>
            <label for="f22_to" class="col-md-1" th:text="#{ip.searchform.dateto}"/>
            <div class="col-md-2">
                <input id="f22_to" data-type="datepicker" placeholder="yyyy/mm/dd" class="form-control" name="f22_to" th:value="*{f22_to}">
            </div>
        </div>


        <!-- ********* Locarno classification ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-5 offset-md-1 label-group">
                <strong>(51)</strong> <span th:text="#{ds.searchform.locarno.title}"/>
            </div>
            <div class="col-md-4"><hr/></div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col"></div>
            <label for="f51_1" class="col-md-2" th:text="#{ds.searchform.locarno.class}"/>
            <div class="col-md-1">
                <input class="form-control" type="text" id="f51_1" name="f51_1" size="3" maxlength="2">
            </div>
            <label for="f51_2" class="col-md-2" th:text="#{ds.searchform.locarno.subclass}"/>
            <div class="col-md-1">
                <input class="form-control" type="text" id="f51_2" name="f51_2" size="3" maxlength="2">
            </div>
        </div>

        <!-- ********* Applicant ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-3 offset-md-1 label-group">
                <strong>(73)</strong>
                <span th:text="#{ip.searchform.applicant.ds}"/>
            </div>
            <div class="col-md-6"><hr></div>
        </div>
        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f73_name_mc" th:text="#{ip.searchform.name}"/>
            </div>
            <div class="col-md-3">
                <select id="f73_name_mc" class="form-control" name="f73_name_mc">
                    <option value="eq" th:text="#{common.dropdown.option.equals}"/>
                    <option value="has" selected="selected" th:text="#{common.dropdown.option.contains}"/>
                    <option value="sw" th:text="#{common.dropdown.option.startswith}"/>
                    <option value="ew" th:text="#{common.dropdown.option.endswith}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f73_name" maxlength="128">
            </div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f73_address_mc" th:text="#{ip.searchform.address}"/>
            </div>
            <div class="col-md-3">
                <select id="f73_address_mc" disabled="disabled" class="form-control" name="f73_address_mc">
                    <option value="has" selected="selected" th:text="#{common.dropdown.option.contains}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f73_address"  maxlength="128">
            </div>
        </div>

        <!-- ********* Registration publication ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-3 offset-md-1 label-group">
                <strong>(45)</strong>
                <span th:text="#{ip.searchform.regpubdate}"/>
            </div>
            <div class="col-md-6"><hr></div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col"></div>
            <label for="f45_year" class="col-md-1" th:text="#{ip.searchform.year}"/>
            <div class="col-md-2">
                <input class="form-control" type="text" id="f45_year" name="f45_year" size="4" maxlength="4">
            </div>
            <label for="f45_bulletin_no" class="col-md-2" th:text="#{ip.searchform.bulletin}"/>
            <div class="col-md-1">
                <input class="form-control" type="text" id="f45_bulletin_no" name="f45_bulletin_no"  size="2" maxlength="2">
            </div>
        </div>

        <!-- ********* Representative ****************  -->

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-3 offset-md-1 label-group">
                <strong>(74)</strong>
                <span th:text="#{ip.searchform.representative}"/>
            </div>
            <div class="col-md-6"><hr></div>
        </div>
        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f74_name_mc">
                    <span for="f74_name_mc" th:text="#{ip.searchform.name}"/>
                </label>
            </div>

            <div class="col-md-3">
                <select class="form-control" id="f74_name_mc" name="f74_name_mc">
                    <option value="eq" th:text="#{common.dropdown.option.equals}"/>
                    <option value="has" selected="selected" th:text="#{common.dropdown.option.contains}"/>
                    <option value="sw" th:text="#{common.dropdown.option.startswith}"/>
                    <option value="ew" th:text="#{common.dropdown.option.endswith}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f74_name" maxlength="64">
            </div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0 zebra">
            <div class="col-md-4 label-col">
                <label for="f74_address_mc" th:text="#{ip.searchform.address}"/>
            </div>
            <div class="col-md-3">
                <select id="f74_address_mc" disabled="disabled" class="form-control" name="f74_address_mc">
                    <option value="has" selected="selected" th:text="#{common.dropdown.option.contains}"/>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="f74_address"  maxlength="64">
            </div>
        </div>

        <input class="btn btn-primary btn-vpb d-none" type="submit" th:value="#{common.searchform.submit}"/>

        <div class="form-group row mr-md-0 ml-md-0">
            <div class="col-md-5 offset-md-5 extend-search-vpb">
                <button type="submit" th:formaction="@{/design/search-form}" class="link-button-extend-search">
                    <img th:src="@{/images/cross.jpg}" border="0"/>
                    <span th:text="#{common.quicksearch}"/></a>
                </button>
            </div>
        </div>

        <div class="form-group row mr-md-0 ml-md-0">
            <div class="col-md-8 offset-md-2 col-sm-12 offset-sm-0 extend-search-vpb">
                <input class="btn btn-primary btn-vpb" type="submit" th:value="#{common.searchform.submit}"/>
                <input class="btn btn-primary btn-vpb" type="reset" th:value="#{common.searchform.reset}"/>
            </div>
        </div>
    </form>

</div>

</body>
</html>
